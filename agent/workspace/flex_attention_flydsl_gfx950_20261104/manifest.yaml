target_op: flex_attention
target_backend: FLYDSL
target_lang: FLYDSL
target_gpu: gfx950
execution_mode: repo
project_skill: primus-turbo-develop
performance_target: "match the TRITON backend: FlyDSL forward and backward time <= Triton's on every target shape"
